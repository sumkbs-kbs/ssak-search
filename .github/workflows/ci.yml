name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  CACHE_TTL_GENERAL: "1800"
  CACHE_TTL_NEWS: "300"

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint & Typecheck (strict)
        run: npm run lint:ci

      # S29 (2026-08-07): lint:eslint:ci runs `eslint src/ tests/ scripts/ eval/
      # --max-warnings=0` (scope extended S57→scripts/, S61→eval/) — a hard
      # regression gate. Any new warning/error fails this step, which fails
      # this job, which blocks the `build` job (needs: lint-typecheck). PRs and
      # pushes to main both run this workflow, so the 0-warning budget is
      # enforced immediately. Keep the budget at 0 — loosen only after fixing
      # the underlying issue (see STRATEGIC_PLAN S24/S25 lint budget pass).
      # S57 (2026-08-09): scope extended to `src/ tests/ scripts/` — the 82 legacy
      # scripts/ warnings (no-explicit-any / no-non-null-assertion / unused) were
      # cleaned so the 0-warning gate now covers the whole reachable codebase.
      # S61 (2026-08-09): scope extended to `eval/` (removed from the eslint
      # global ignores + 15 warnings cleaned) — every TS directory now passes
      # `--max-warnings=0`. eval/ keeps its own overrides (console/any allowed).
      # run directly (no pipe): `set -e -o pipefail` is the GitHub Actions default,
      # but relying on it for exit-code propagation makes the gate fragile if the
      # shell ever changes. ESLint output is already captured in the job log.
      - name: Lint (ESLint — 0-warning gate)
        run: npm run lint:eslint:ci

      # S62/S64 (2026-08-09): format:check now covers src/ tests/ scripts/ eval/
      # + root — every TS file in the repo must be prettier-clean. The gate was
      # red at HEAD (86 src/tests files + eval/*.ts were unformatted); the
      # working-tree reformat turns it green once committed. eval.yml also runs
      # this step for scheduled/manual eval triggers.
      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (dependency audit)
        run: |
          echo "Checking dependency vulnerabilities..."
          npm audit --audit-level=high 2>&1 | tail -5 || true
          echo "✓ Dependency audit complete"

      - name: Lint (TODO/FIXME markers)
        run: |
          echo "Checking for TODO/FIXME markers in src/..."
          TODOS=$(grep -rn 'TODO\|FIXME\|HACK\|XXX' src/ 2>/dev/null | grep -v '.test.ts' || true)
          if [ -n "$TODOS" ]; then
            COUNT=$(echo "$TODOS" | wc -l)
            echo "::warning::Found $COUNT TODO/FIXME/HACK markers"
            echo "$TODOS"
          else
            echo "No TODO/FIXME markers found"
          fi

      # 2026-08-10 (act cross-check): the old inline regex (/\/\/.*$/gm)
      # corrupted `//` INSIDE string literals (https:// URLs in comments
      # became broken "https:) and the step was red even though wrangler
      # itself parses the file. scripts/verify-jsonc.ts strips comments
      # outside strings only (string-aware), tolerates JSONC trailing
      # commas, and JSON.parse()es both wrangler.jsonc + wrangler.dev.jsonc.
      - name: Verify wrangler.jsonc integrity
        run: npx tsx scripts/verify-jsonc.ts

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit Tests + Coverage
        run: |
          npx vitest run --project unit --coverage --reporter=verbose --reporter=json --outputFile=coverage.json 2>&1

      - name: Upload coverage to GitHub Summary
        run: |
          if [ -f "coverage.json" ]; then
            LINES=$(jq -r '.total.lines.pct // "N/A"' coverage.json 2>/dev/null)
            BRANCHES=$(jq -r '.total.branches.pct // "N/A"' coverage.json 2>/dev/null)
            FUNCTIONS=$(jq -r '.total.functions.pct // "N/A"' coverage.json 2>/dev/null)
            echo "### Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| **Lines** | ${LINES}% |" >> $GITHUB_STEP_SUMMARY
            echo "| **Branches** | ${BRANCHES}% |" >> $GITHUB_STEP_SUMMARY
            echo "| **Functions** | ${FUNCTIONS}% |" >> $GITHUB_STEP_SUMMARY
            echo "✅ Coverage report generated"
          else
            echo "Coverage report not generated"
          fi

      - name: Snapshot Integrity Check
        run: |
          if [ -n "$(git status --porcelain tests/unit/snapshots/ tests/unit/__snapshots__/ 2>/dev/null)" ]; then
            echo "::error::Snapshot files have uncommitted changes. Run 'npm test -- -u' locally, review, and commit."
            exit 1
          fi
          echo "Snapshot integrity OK"

  binding-verify:
    name: Binding Verification
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # 2026-08-10 (act cross-check): the job previously checked wrangler.jsonc
      # (production), which is a Pages project — wrangler pages deploy REJECTS
      # durable_objects without a script_name, so production DO/R2 bindings are
      # intentionally NOT in the file (configured via Dashboard) and the check
      # ALWAYS failed. The meaningful static target is wrangler.dev.jsonc, which
      # declares all 11 DO + R2 + INDEX_QUEUE for local dev.
      - name: Verify DO Binding (wrangler.dev.jsonc)
        run: npx tsx scripts/verify-do-binding.ts --config=wrangler.dev.jsonc

      - name: Verify Analytics Engine Config
        run: npx tsx scripts/verify-analytics-binding.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist output
        run: |
          if [ -f "dist/_worker.js" ]; then
            SIZE=$(wc -c < dist/_worker.js)
            echo "✓ Build output: $SIZE bytes ($((SIZE / 1024)) KB)"
          else
            echo "::error::Build output missing: dist/_worker.js not found"
            exit 1
          fi

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-bundle
          path: dist/
          retention-days: 7
