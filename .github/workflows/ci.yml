name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  CACHE_TTL_GENERAL: "1800"
  CACHE_TTL_NEWS: "300"

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint & Typecheck (strict)
        run: npm run lint:ci

      # S29 (2026-08-07): lint:eslint:ci runs `eslint src/ tests/ scripts/ eval/
      # --max-warnings=0` (scope extended S57→scripts/, S61→eval/) — a hard
      # regression gate. Any new warning/error fails this step, which fails
      # this job, which blocks the `build` job (needs: lint-typecheck). PRs and
      # pushes to main both run this workflow, so the 0-warning budget is
      # enforced immediately. Keep the budget at 0 — loosen only after fixing
      # the underlying issue (see STRATEGIC_PLAN S24/S25 lint budget pass).
      # S57 (2026-08-09): scope extended to `src/ tests/ scripts/` — the 82 legacy
      # scripts/ warnings (no-explicit-any / no-non-null-assertion / unused) were
      # cleaned so the 0-warning gate now covers the whole reachable codebase.
      # S61 (2026-08-09): scope extended to `eval/` (removed from the eslint
      # global ignores + 15 warnings cleaned) — every TS directory now passes
      # `--max-warnings=0`. eval/ keeps its own overrides (console/any allowed).
      # run directly (no pipe): `set -e -o pipefail` is the GitHub Actions default,
      # but relying on it for exit-code propagation makes the gate fragile if the
      # shell ever changes. ESLint output is already captured in the job log.
      - name: Lint (ESLint — 0-warning gate)
        run: npm run lint:eslint:ci

      # S62/S64 (2026-08-09): format:check now covers src/ tests/ scripts/ eval/
      # + root — every TS file in the repo must be prettier-clean. The gate was
      # red at HEAD (86 src/tests files + eval/*.ts were unformatted); the
      # working-tree reformat turns it green once committed. eval.yml also runs
      # this step for scheduled/manual eval triggers.
      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (dependency audit)
        run: |
          echo "Checking dependency vulnerabilities..."
          npm audit --audit-level=high 2>&1 | tail -5 || true
          echo "✓ Dependency audit complete"

      - name: Lint (TODO/FIXME markers)
        run: |
          echo "Checking for TODO/FIXME markers in src/..."
          TODOS=$(grep -rn 'TODO\|FIXME\|HACK\|XXX' src/ 2>/dev/null | grep -v '.test.ts' || true)
          if [ -n "$TODOS" ]; then
            COUNT=$(echo "$TODOS" | wc -l)
            echo "::warning::Found $COUNT TODO/FIXME/HACK markers"
            echo "$TODOS"
          else
            echo "No TODO/FIXME markers found"
          fi

      # 2026-08-10 (act cross-check): the old inline regex (/\/\/.*$/gm)
      # corrupted `//` INSIDE string literals (https:// URLs in comments
      # became broken "https:) and the step was red even though wrangler
      # itself parses the file. scripts/verify-jsonc.ts strips comments
      # outside strings only (string-aware), tolerates JSONC trailing
      # commas, and JSON.parse()es both wrangler.jsonc + wrangler.dev.jsonc.
      # S86 (2026-08-10): --eval also validates the SAVED eval artifacts
      # (eval/results/*.json + eval/baselines/*.json) that verify-commit-
      # eval.ts and the S54 recompute path consume — a truncated run file
      # (corrupt JSON or a parseable-but-shapeless `{}`) is caught here at
      # push time instead of surfacing as a confusing gate ERROR later.
      # Commits WITHOUT artifacts print SKIP and pass.
      - name: Verify JSON/JSONC integrity (wrangler + eval artifacts)
        run: npx tsx scripts/verify-jsonc.ts --eval

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit Tests + Coverage
        run: |
          npx vitest run --project unit --coverage --reporter=verbose --reporter=json --outputFile=coverage.json 2>&1

      - name: Upload coverage to GitHub Summary
        run: |
          if [ -f "coverage.json" ]; then
            LINES=$(jq -r '.total.lines.pct // "N/A"' coverage.json 2>/dev/null)
            BRANCHES=$(jq -r '.total.branches.pct // "N/A"' coverage.json 2>/dev/null)
            FUNCTIONS=$(jq -r '.total.functions.pct // "N/A"' coverage.json 2>/dev/null)
            echo "### Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| **Lines** | ${LINES}% |" >> $GITHUB_STEP_SUMMARY
            echo "| **Branches** | ${BRANCHES}% |" >> $GITHUB_STEP_SUMMARY
            echo "| **Functions** | ${FUNCTIONS}% |" >> $GITHUB_STEP_SUMMARY
            echo "✅ Coverage report generated"
          else
            echo "Coverage report not generated"
          fi

      - name: Snapshot Integrity Check
        run: |
          if [ -n "$(git status --porcelain tests/unit/snapshots/ tests/unit/__snapshots__/ 2>/dev/null)" ]; then
            echo "::error::Snapshot files have uncommitted changes. Run 'npm test -- -u' locally, review, and commit."
            exit 1
          fi
          echo "Snapshot integrity OK"

  binding-verify:
    name: Binding Verification
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # 2026-08-10 (act cross-check): the job previously checked wrangler.jsonc
      # (production), which is a Pages project — wrangler pages deploy REJECTS
      # durable_objects without a script_name, so production DO/R2 bindings are
      # intentionally NOT in the file (configured via Dashboard) and the check
      # ALWAYS failed. The meaningful static target is wrangler.dev.jsonc, which
      # declares all 11 DO + R2 + INDEX_QUEUE for local dev.
      - name: Verify DO Binding (wrangler.dev.jsonc)
        run: npx tsx scripts/verify-do-binding.ts --config=wrangler.dev.jsonc

      - name: Verify Analytics Engine Config
        run: npx tsx scripts/verify-analytics-binding.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist output
        run: |
          if [ -f "dist/_worker.js" ]; then
            SIZE=$(wc -c < dist/_worker.js)
            echo "✓ Build output: $SIZE bytes ($((SIZE / 1024)) KB)"
          else
            echo "::error::Build output missing: dist/_worker.js not found"
            exit 1
          fi

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-bundle
          path: dist/
          retention-days: 7

  # 2026-08-10: per-commit gate replay — mirrors the local pre-flight tool
  # (scripts/verify-commits-ci.sh). Every job above gates the MERGED tree once;
  # this job replays the same gate set against EVERY commit in the push/PR
  # range via git worktrees, so a regression introduced mid-range is caught at
  # the exact commit that broke it (and the new red-gate summary pinpoints
  # the gates + files). The eval gate (--eval) is included: it replays the
  # eval regression comparison offline from committed run-*.json artifacts
  # (seconds, no network; commits without artifacts report SKIP).
  # NOTE: the slow path is a range with lockfile changes — verify-commits-ci.sh
  # then runs npm ci per commit (~1-2 min each). Typical PRs (1-5 commits,
  # no manifest change) finish in 1-2 min.
  preflight-replay:
    name: Per-commit gate replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Resolve commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Merge-base (not base.sha) so a PR head that merged newer main
            # does not drag unrelated base-branch commits into the replay.
            BASE="$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            # First push to the branch: before is empty/zeros. Replaying the
            # FULL history (root..HEAD) would flag historical broken-lock
            # commits as NPMCI-FAIL and can exceed the 20-min budget — the
            # merged-tree gates above already validate HEAD, so this job only
            # needs to pinpoint regressions in the NEW commits. Cap at the
            # last 10 (fall back to root on a younger repo).
            BASE="$(git rev-parse HEAD~10 2>/dev/null || git rev-list --max-parents=0 HEAD | head -1)"
          fi
          if [ "$BASE" = "$HEAD" ]; then
            # No-op push (before == sha): empty range would make the script
            # exit 2 and fail the job. Skip with a note instead.
            echo "Range is empty (before == sha) — nothing to replay, skipping."
            echo "range-skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "range=${BASE}..${HEAD}" >> "$GITHUB_OUTPUT"
            echo "Replaying gates for range ${BASE}..${HEAD}"
          fi

      # S86j: the local pre-push 3-check bundle (scripts/preflight-push.sh) is
      # split into two CI steps so the HEAD-scoped checks (②③) survive the
      # >15-commit replay skip: ① per-commit gate replay (verify-commits-ci.sh
      # --eval) ② HEAD eval gate with the S86i scoring-drift marker ③ baseline
      # equivalence (recomputed NDCG@10 vs the stored baseline). --ci makes ③
      # DRIFT a ::warning:: (provenance note — S86i explains which scoring
      # files moved NDCG) instead of a failure; ③ ERROR (corrupt artifacts) and
      # ① ② regressions still fail the job. Local preflight and CI run the
      # SAME script (②③ via preflight-push.sh --skip-replay) — no drift
      # between the two preflight surfaces.
      - name: Replay gates per commit (preflight ①)
        if: steps.range.outputs.range-skip != 'true'
        run: |
          COUNT=$(git rev-list --count "${{ steps.range.outputs.range }}")
          if [ "$COUNT" -gt 15 ]; then
            echo "::warning::Range has $COUNT commits (>15) — skipping per-commit replay to stay within the 20-min budget (lockfile-heavy ranges run npm ci per commit). The merged-tree gates above validate HEAD; the baseline-equivalence step below still runs."
            exit 0
          fi
          bash scripts/verify-commits-ci.sh "${{ steps.range.outputs.range }}" --eval

      - name: Baseline equivalence + S86i marker (preflight ②③)
        if: steps.range.outputs.range-skip != 'true'
        run: bash scripts/preflight-push.sh "${{ steps.range.outputs.range }}" --ci --skip-replay
