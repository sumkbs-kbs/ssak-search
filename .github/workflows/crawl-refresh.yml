name: Crawl Refresh Scheduler

on:
  schedule:
    - cron: '0 */4 * * *'   # Every 4 hours — importance-based re-indexing (Phase B.4)
  workflow_dispatch:
    inputs:
      target_url:
        description: 'API URL to refresh (default: production)'
        required: false
        default: 'https://ssak-search.pages.dev'

env:
  TARGET_URL: ${{ github.event.inputs.target_url || 'https://ssak-search.pages.dev' }}

jobs:
  refresh:
    name: Run refresh scheduler
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger /api/crawl/refresh
        run: |
          if [ -z "$SEARCH_API_KEY" ]; then
            echo "SEARCH_API_KEY not configured — skipping refresh (endpoint requires auth)"
            exit 0
          fi
          RESPONSE=$(curl -sf --max-time 120 -X POST \
            -H "X-API-Key: $SEARCH_API_KEY" \
            -H 'Content-Type: application/json' \
            "$TARGET_URL/api/crawl/refresh" 2>&1) || { echo "Refresh request failed: $RESPONSE"; exit 1; }
          echo "=== Refresh Result ==="
          echo "$RESPONSE" | jq .
        env:
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          TARGET_URL: ${{ env.TARGET_URL }}

      - name: GitHub Summary
        if: always()
        run: |
          echo "## Crawl Refresh — $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: ${{ env.TARGET_URL }}" >> $GITHUB_STEP_SUMMARY
