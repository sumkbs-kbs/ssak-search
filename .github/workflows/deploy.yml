name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy to environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: "20"
  PROJECT_NAME: "search-engine-api"

jobs:
  deploy-staging:
    name: Deploy to Cloudflare Pages (Staging)
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: staging
      url: https://staging.search-engine-api.pages.dev
    steps:
      # Full history is REQUIRED: the pre/post-deploy commit-drift gates resolve
      # the CURRENT deployment's Source commit (an older SHA) against the
      # checked-out commit via git rev-list/merge-base. A depth-1 clone cannot
      # resolve the old SHA and would fail the gates on every deploy
      # (S104-③-⑥, S104-③-⑥-②).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify staging deployment commit baseline (pre-deploy guard)
        # S104-③-⑥-② (2026-08-12): same guard as production. FAIL_ON_COMMIT_DRIFT=1
        # + ALLOW_BEHIND=1 blocks only when the CURRENT staging deployment is at
        # a commit we don't know (ahead/diverged/foreign) — deploying would
        # clobber newer code. Behind or a not-yet-deployed branch (first
        # staging deploy) are allowed. COMMIT_CHECK_ONLY keeps it fast.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENVIRONMENT: staging
          EXPECTED_COMMIT: ${{ github.sha }}
          FAIL_ON_COMMIT_DRIFT: "1"
          ALLOW_BEHIND: "1"
          COMMIT_CHECK_ONLY: "1"
          npm_config_yes: "true"
        run: bash scripts/verify-do-binding.sh

      - name: Download CI artifact
        id: download
        # S104-③-⑥-④ (2026-08-12): the worker-bundle artifact is uploaded by
        # the CI run that TRIGGERED this workflow_run event, so it must be
        # fetched with run-id pointing at that run — without run-id,
        # download-artifact@v4 looks in the CURRENT (deploy) run and always
        # fails. On workflow_dispatch there is no CI artifact; the fallback
        # build steps below handle that. continue-on-error is kept so a failed
        # download never aborts the job — the build fallback is gated on the
        # step OUTCOME (failure), not the job-level failure() helper, because
        # a continue-on-error step's conclusion is "success" and failure()
        # would return false even though the download failed (the 2026-08-12
        # CI run skipped the fallback build exactly this way).
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: worker-bundle
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Setup Node (if artifact not found)
        if: github.event_name == 'workflow_dispatch' || steps.download.outcome == 'failure'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies (if artifact not found)
        if: github.event_name == 'workflow_dispatch' || steps.download.outcome == 'failure'
        run: npm ci

      - name: Build (if artifact not found)
        if: github.event_name == 'workflow_dispatch' || steps.download.outcome == 'failure'
        run: npm run build

      - name: Deploy do-worker (Staging)
        # S94 (2026-08-10): Pages references the 11 Durable Objects via
        # script_name → ssak-do-worker (S88). Deploy the DO worker BEFORE the
        # Pages bundle so the script_name binding always points at the newest
        # DO code. Do-worker uses the same wrangler.do.jsonc config.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config=wrangler.do.jsonc

      - name: Deploy to Pages (Staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=${{ env.PROJECT_NAME }} --branch=staging

      - name: Deploy probe-scheduler (Staging)
        # S104-③-fix (2026-08-11): Pages cannot host cron triggers, so the
        # 15-min deep-probe scheduler is a separate Workers script. Deploy
        # AFTER Pages so its PROBE_URL var points at the newest bundle.
        # S104-③-⑤ (2026-08-11): the staging job deploys the STAGING scheduler
        # (wrangler.cron.staging.jsonc, PROBE_URL=staging alias) instead of the
        # production one — previously this step pointed the staging deploy's
        # scheduler at the production URL, probing the wrong environment.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config=wrangler.cron.staging.jsonc

      - name: Verify deployed commit matches repo (post-deploy gate)
        # S104-③-⑥-② (2026-08-12): after the staging deploy, require the
        # recorded deployment Source commit to EQUAL the checked-out commit
        # exactly (FAIL_ON_COMMIT_DRIFT=1, no ALLOW_BEHIND). Catches a deploy
        # that pushed a stale/wrong bundle while still reporting success.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENVIRONMENT: staging
          EXPECTED_COMMIT: ${{ github.sha }}
          FAIL_ON_COMMIT_DRIFT: "1"
          COMMIT_CHECK_ONLY: "1"
          npm_config_yes: "true"
        run: |
          sleep 5
          bash scripts/verify-do-binding.sh

  deploy-production:
    name: Deploy to Cloudflare Pages (Production)
    # S104-③-⑥-③ (2026-08-12): a workflow_dispatch with environment=production
    # SKIPS deploy-staging (its `if` requires staging), and a skipped needed
    # job skips dependents by default — the very first dispatch run concluded
    # "skipped" with zero jobs executed (run 31551613272). The explicit needs
    # result check lets production run on success OR skip (but not failure/
    # cancellation).
    if: >
      github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
      && (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: production
      url: https://search-engine-api.pages.dev
    needs: [deploy-staging]
    steps:
      # Full history is REQUIRED: the pre/post-deploy commit-drift gates resolve
      # the CURRENT deployment's Source commit (an older SHA) against the
      # checked-out commit via git rev-list/merge-base. A depth-1 clone cannot
      # resolve the old SHA and would fail the gates on every deploy
      # (S104-③-⑥).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify production deployment commit baseline (pre-deploy guard)
        # S104-③-⑥ (2026-08-11): enforce commit consistency BEFORE deploying.
        # FAIL_ON_COMMIT_DRIFT=1 + ALLOW_BEHIND=1 blocks only when the CURRENT
        # production deployment is at a commit we don't know (ahead/diverged/
        # foreign) — deploying would clobber newer code. A deployment strictly
        # behind the expected commit is the normal catch-up case and is
        # allowed. COMMIT_CHECK_ONLY keeps it fast (no health/tail checks).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENVIRONMENT: production
          EXPECTED_COMMIT: ${{ github.sha }}
          FAIL_ON_COMMIT_DRIFT: "1"
          ALLOW_BEHIND: "1"
          COMMIT_CHECK_ONLY: "1"
          npm_config_yes: "true"
        run: bash scripts/verify-do-binding.sh

      - name: Download CI artifact
        id: download
        # S104-③-⑥-④ (2026-08-12): the worker-bundle artifact is uploaded by
        # the CI run that TRIGGERED this workflow_run event, so it must be
        # fetched with run-id pointing at that run — without run-id,
        # download-artifact@v4 looks in the CURRENT (deploy) run and always
        # fails. On workflow_dispatch there is no CI artifact; the fallback
        # build steps below handle that. continue-on-error is kept so a failed
        # download never aborts the job — the build fallback is gated on the
        # step OUTCOME (failure), not the job-level failure() helper, because
        # a continue-on-error step's conclusion is "success" and failure()
        # would return false even though the download failed (the 2026-08-12
        # CI run skipped the fallback build exactly this way).
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: worker-bundle
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Setup Node (if artifact not found)
        if: github.event_name == 'workflow_dispatch' || steps.download.outcome == 'failure'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies (if artifact not found)
        if: github.event_name == 'workflow_dispatch' || steps.download.outcome == 'failure'
        run: npm ci

      - name: Build (if artifact not found)
        if: github.event_name == 'workflow_dispatch' || steps.download.outcome == 'failure'
        run: npm run build

      - name: Deploy do-worker (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config=wrangler.do.jsonc

      - name: Deploy to Pages (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=${{ env.PROJECT_NAME }} --branch=main

      - name: Deploy probe-scheduler (Production)
        # S104-③-fix (2026-08-11): same scheduler as staging — Workers cron
        # that triggers the Pages deep probe every 15 min.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config=wrangler.cron.jsonc

      - name: Verify deployed commit matches repo (post-deploy gate)
        # S104-③-⑥ (2026-08-11): after the Pages deploy, require the recorded
        # deployment Source commit to EQUAL the checked-out commit exactly
        # (FAIL_ON_COMMIT_DRIFT=1, no ALLOW_BEHIND). Catches a deploy that
        # pushed a stale/wrong bundle while still reporting success. Sleep lets
        # Cloudflare record the new deployment before the list query.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENVIRONMENT: production
          EXPECTED_COMMIT: ${{ github.sha }}
          FAIL_ON_COMMIT_DRIFT: "1"
          COMMIT_CHECK_ONLY: "1"
          npm_config_yes: "true"
        run: |
          sleep 5
          bash scripts/verify-do-binding.sh
