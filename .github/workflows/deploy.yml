name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy to environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  # S104-③-⑥-④ (2026-08-12): wrangler 4.121.0 (installed by
  # cloudflare/wrangler-action@v3) requires Node >= 22 — the previous
  # NODE_VERSION 20 made the deploy-do-worker step fail with
  # "Wrangler requires at least Node.js v22.0.0" (observed in the staging
  # workflow_dispatch run 31552212422). package.json engines is >=20, so 22
  # is compatible for the build fallback too. Local dev runs Node 22.
  NODE_VERSION: "22"
  PROJECT_NAME: "search-engine-api"

jobs:
  deploy-staging:
    name: Deploy to Cloudflare Pages (Staging)
    # S104-③-⑦-③ (2026-08-12): the repo default workflow permissions are the
    # RESTRICTED set (Contents/Metadata/Packages read ONLY — no actions:read),
    # so download-artifact@v4 could not list the triggering CI run's artifacts
    # and failed with "Artifact not found for name: worker-bundle" on every
    # workflow_run deploy (the fallback build then ran). Declare actions:read
    # explicitly (with contents:read for checkout) to restore the documented
    # workflow_run artifact path.
    permissions:
      actions: read
      contents: read
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-latest
    # 수정 33 (2026-08-14): 동치 대조 게이트 추가로 8분에서 연장 — 최악 2회 시도
    # (대조 ~2분 × 2 + 재시도 45s) 까지 흡수.
    timeout-minutes: 12
    environment:
      name: staging
      url: https://staging.search-engine-api.pages.dev
    steps:
      # Full history is REQUIRED: the pre/post-deploy commit-drift gates resolve
      # the CURRENT deployment's Source commit (an older SHA) against the
      # checked-out commit via git rev-list/merge-base. A depth-1 clone cannot
      # resolve the old SHA and would fail the gates on every deploy
      # (S104-③-⑥, S104-③-⑥-②).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify staging deployment commit baseline (pre-deploy guard)
        # S104-③-⑥-② (2026-08-12): same guard as production. FAIL_ON_COMMIT_DRIFT=1
        # + ALLOW_BEHIND=1 blocks only when the CURRENT staging deployment is at
        # a commit we don't know (ahead/diverged/foreign) — deploying would
        # clobber newer code. Behind or a not-yet-deployed branch (first
        # staging deploy) are allowed. COMMIT_CHECK_ONLY keeps it fast.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENVIRONMENT: staging
          EXPECTED_COMMIT: ${{ github.sha }}
          FAIL_ON_COMMIT_DRIFT: "1"
          ALLOW_BEHIND: "1"
          COMMIT_CHECK_ONLY: "1"
          npm_config_yes: "true"
        run: bash scripts/verify-do-binding.sh

      - name: Download CI artifact
        id: download
        # S104-③-⑥-④ (2026-08-12): the worker-bundle artifact is uploaded by
        # the CI run that TRIGGERED this workflow_run event, so it must be
        # fetched with run-id pointing at that run — without run-id,
        # download-artifact@v4 looks in the CURRENT (deploy) run and always
        # fails. On workflow_dispatch there is no CI artifact; the fallback
        # build steps below handle that. continue-on-error is kept so a failed
        # download never aborts the job — the build fallback is gated on the
        # step OUTCOME (failure), not the job-level failure() helper, because
        # a continue-on-error step's conclusion is "success" and failure()
        # would return false even though the download failed (the 2026-08-12
        # CI run skipped the fallback build exactly this way).
        # S104-③-⑦-③ (2026-08-12): TWO conditions are required for a
        # cross-workflow download. (1) job permissions.actions: read (the repo
        # default token is Contents/Metadata/Packages-only — without actions:read
        # the action cannot even list the triggering run's artifacts), AND
        # (2) an EXPLICIT github-token — download-artifact@v4's implicit runner
        # token is scoped to the CURRENT run, so even with actions:read the
        # default path fails "Artifact not found for name: worker-bundle"
        # (observed on the 09:30Z run after the permissions fix alone).
        # 방안 B (2026-08-14): staging 은 DEPLOY_ENV=staging 으로 빌드된
        # worker-bundle-staging 을 받는다 (ci.yml 에서 환경별로 별도 빌드·업로드).
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: worker-bundle-staging
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Setup Node (if artifact not found)
        if: github.event_name == 'workflow_dispatch' || steps.download.outcome == 'failure'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies (if artifact not found)
        if: github.event_name == 'workflow_dispatch' || steps.download.outcome == 'failure'
        run: npm ci

      - name: Build (if artifact not found)
        if: github.event_name == 'workflow_dispatch' || steps.download.outcome == 'failure'
        run: npm run build
        env:
          # 방안 B: 폴백 빌드도 환경별 DO 인스턴스 키를 주입해야 한다.
          DEPLOY_ENV: staging

      - name: Deploy do-worker (Staging)
        # S94 (2026-08-10): Pages references the 11 Durable Objects via
        # script_name → ssak-do-worker (S88). Deploy the DO worker BEFORE the
        # Pages bundle so the script_name binding always points at the newest
        # DO code. Do-worker uses the same wrangler.do.jsonc config.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config=wrangler.do.jsonc

      - name: Deploy to Pages (Staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=${{ env.PROJECT_NAME }} --branch=staging

      - name: Deploy probe-scheduler (Staging)
        # S104-③-fix (2026-08-11): Pages cannot host cron triggers, so the
        # 15-min deep-probe scheduler is a separate Workers script. Deploy
        # AFTER Pages so its PROBE_URL var points at the newest bundle.
        # S104-③-⑤ (2026-08-11): the staging job deploys the STAGING scheduler
        # (wrangler.cron.staging.jsonc, PROBE_URL=staging alias) instead of the
        # production one — previously this step pointed the staging deploy's
        # scheduler at the production URL, probing the wrong environment.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config=wrangler.cron.staging.jsonc

      - name: Verify deployed commit matches repo (post-deploy gate)
        # S104-③-⑥-② (2026-08-12): after the staging deploy, require the
        # recorded deployment Source commit to EQUAL the checked-out commit
        # exactly (FAIL_ON_COMMIT_DRIFT=1, no ALLOW_BEHIND). Catches a deploy
        # that pushed a stale/wrong bundle while still reporting success.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENVIRONMENT: staging
          EXPECTED_COMMIT: ${{ github.sha }}
          FAIL_ON_COMMIT_DRIFT: "1"
          COMMIT_CHECK_ONLY: "1"
          npm_config_yes: "true"
        run: |
          sleep 5
          bash scripts/verify-do-binding.sh

      - name: Verify staging↔production equivalence (post-deploy gate)
        id: equivalence
        # 수정 33/34 (2026-08-14): 매 staging 배포 후 staging ↔ production 의
        # 런타임 동치를 자동 대조한다 — 검색 top-5 도메인 시퀀스 + gold 회수 +
        # 공통 호스트 down 여부 (verify-env-equivalence.sh). SKIP_COMMIT=1:
        # 커밋 일치는 위 post-deploy gate(verify-do-binding.sh)가 이미 검증하고,
        # dispatch 단독 실행 시 production 미배포(커밋 불일치)는 정상 상태이므로
        # 커밋 항목은 게이트에서 제외한다. 실패 시 Slack 알림(EQ_NOTIFY —
        # ALERT_SLACK_WEBHOOK 시크릿, 미설정이면 no-op) 후 job 을 실패 처리한다.
        # workflow_run 에서 production 배포가 동시 진행 중일 수 있어 45s 간격 1회
        # 재시도 — 중간 시도는 조용히(EQ_NOTIFY=0), 최종 시도에서만 알림.
        # (조건 없음 = 이전 단계(사전 guard/배포/post-deploy gate)가 전부 성공한
        # 경우에만 실행 — 배포 실패 시 동치 대조를 돌리지 않는다.)
        # 수정 51 (2026-08-15): 웹훅 시크릿 이름 양쪽(SLACK_WEBHOOK — Pages 프로젝트
        # 관례 / ALERT_SLACK_WEBHOOK — docs 관례) 모두 지원 — 어느 쪽이 설정돼도
        # 알림이 동작한다 (verify-env-equivalence.sh resolveWebhookUrl: SLACK_WEBHOOK 우선).
        env:
          SLACK_WEBHOOK: ${{ secrets.ALERT_SLACK_WEBHOOK }}
          ALERT_SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for i in 1 2; do
            if EQ_NOTIFY=$([ "$i" = "2" ] && echo 1 || echo 0) SKIP_COMMIT=1 \
              bash scripts/verify-env-equivalence.sh; then
              exit 0
            fi
            echo "⚠️ 동치 대조 실패 (시도 $i/2) — 45s 후 재시도 (production 배포 동시 진행 가능)"
            sleep 45
          done
          exit 1

      - name: Notify staging pipeline failure (Slack)
        # 수정 51 (2026-08-15): 동치 대조 게이트 이전 단계(사전 guard/배포/post-deploy
        # gate)가 실패하면 동치 대조 자체가 실행되지 않아 알림이 전혀 없었다 — staging
        # 파이프라인 **어느 단계에서든** 실패하면 Slack 알림이 가도록 일반 실패 알림을
        # 추가한다. 동치 대조 실패는 위 게이트가 상세 알림(호스트 diff/gold 회수율)을
        # 이미 보내므로 중복을 피해 이 단계에서는 제외한다.
        #
        # 조건: `steps.equivalence.outcome == 'skipped'` — equivalence 는 마지막
        # 스텝이고 if 조건이 없으므로, 'skipped' 는 곧 **이전 단계 실패**(실패 시
        # 후속 스텝 스킵)를 의미한다. 동치 대조가 실행돼 실패하면 outcome='failure'
        # (이미 EQ_NOTIFY 상세 알림 발송) → 여기선 스킵. `failure()` 를 쓰지 않는
        # 이유: 다운로드 스텝(continue-on-error) 이후 `if: failure()` 는 발화하지
        # 않을 수 있어 verify-deploy-workflow 가 거부한다 (S104-③-⑦-③ 실측).
        # ⚠️ `!cancelled()` 를 **앞에** 쓰지 말 것 — YAML 1.2 에서 ! 로 시작하는
        # plain scalar 는 tag 로 해석돼 GitHub 파서가 deploy.yml 전체를 로드 실패
        # (workflow_run 미발화, 2026-08-15 실측) → `!` 가 scalar 시작이 아니도록
        # 뒤로 배치 (논리적 동치: A && B == B && A).
        if: steps.equivalence.outcome == 'skipped' && !cancelled()
        env:
          SLACK_WEBHOOK: ${{ secrets.ALERT_SLACK_WEBHOOK || secrets.SLACK_WEBHOOK }}
        run: |
          if [ -z "${SLACK_WEBHOOK:-}" ]; then
            echo "ℹ️ SLACK_WEBHOOK 미설정 — 실패 알림 생략 (no-op)"
            exit 0
          fi
          PAYLOAD=$(python3 -c '
          import json, sys
          repo, run_url = sys.argv[1], sys.argv[2]
          print(json.dumps({
            "text": f"❌ staging 배포 파이프라인 실패 — {repo}",
            "attachments": [{
              "color": "danger",
              "blocks": [
                {"type": "section", "text": {"type": "mrkdwn", "text": f"*staging 배포 실패* — {repo}"}},
                {"type": "context", "elements": [{"type": "mrkdwn", "text": f"run: <{run_url}>"}]},
              ],
            }],
          }))
          '
          "${{ github.repository }}" "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          if curl -sf -m 10 -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$SLACK_WEBHOOK"; then
            echo "✅ Slack 알림 전송됨 (danger)"
          else
            echo "⚠️ Slack 알림 전송 실패 — 로그로만 남깁니다" >&2
          fi

  deploy-production:
    name: Deploy to Cloudflare Pages (Production)
    # S104-③-⑥-③/④ (2026-08-12): job is INDEPENDENT of deploy-staging (no
    # needs) — a workflow_dispatch with environment=production skips
    # deploy-staging, and GitHub's default skip-propagation then skips any
    # job that `needs` it EVEN IF its if-condition allows skipped. Both the
    # first dispatch (run 31551613272, concluded "skipped") and the
    # production dispatches after the needs-result fix (runs 31552128466,
    # 31552497675, both "skipped") proved the needs-based guard does not
    # work: a skipped needed job skips the dependent regardless of the
    # explicit result check. Since each job does its own checkout+build+
    # deploy, the jobs are truly independent — the `if` alone routes the
    # dispatch to exactly one of them.
    # S104-③-⑦-③: permissions (actions:read for the artifact download,
    # contents:read for checkout) — see deploy-staging for the rationale.
    permissions:
      actions: read
      contents: read
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: production
      url: https://search-engine-api.pages.dev
    steps:
      # Full history is REQUIRED: the pre/post-deploy commit-drift gates resolve
      # the CURRENT deployment's Source commit (an older SHA) against the
      # checked-out commit via git rev-list/merge-base. A depth-1 clone cannot
      # resolve the old SHA and would fail the gates on every deploy
      # (S104-③-⑥).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify production deployment commit baseline (pre-deploy guard)
        # S104-③-⑥ (2026-08-11): enforce commit consistency BEFORE deploying.
        # FAIL_ON_COMMIT_DRIFT=1 + ALLOW_BEHIND=1 blocks only when the CURRENT
        # production deployment is at a commit we don't know (ahead/diverged/
        # foreign) — deploying would clobber newer code. A deployment strictly
        # behind the expected commit is the normal catch-up case and is
        # allowed. COMMIT_CHECK_ONLY keeps it fast (no health/tail checks).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENVIRONMENT: production
          EXPECTED_COMMIT: ${{ github.sha }}
          FAIL_ON_COMMIT_DRIFT: "1"
          ALLOW_BEHIND: "1"
          COMMIT_CHECK_ONLY: "1"
          npm_config_yes: "true"
        run: bash scripts/verify-do-binding.sh

      - name: Download CI artifact
        id: download
        # S104-③-⑥-④ (2026-08-12): the worker-bundle artifact is uploaded by
        # the CI run that TRIGGERED this workflow_run event, so it must be
        # fetched with run-id pointing at that run — without run-id,
        # download-artifact@v4 looks in the CURRENT (deploy) run and always
        # fails. On workflow_dispatch there is no CI artifact; the fallback
        # build steps below handle that. continue-on-error is kept so a failed
        # download never aborts the job — the build fallback is gated on the
        # step OUTCOME (failure), not the job-level failure() helper, because
        # a continue-on-error step's conclusion is "success" and failure()
        # would return false even though the download failed (the 2026-08-12
        # CI run skipped the fallback build exactly this way).
        # S104-③-⑦-③ (2026-08-12): TWO conditions are required for a
        # cross-workflow download. (1) job permissions.actions: read (the repo
        # default token is Contents/Metadata/Packages-only — without actions:read
        # the action cannot even list the triggering run's artifacts), AND
        # (2) an EXPLICIT github-token — download-artifact@v4's implicit runner
        # token is scoped to the CURRENT run, so even with actions:read the
        # default path fails "Artifact not found for name: worker-bundle"
        # (observed on the 09:30Z run after the permissions fix alone).
        # 방안 B (2026-08-14): production 은 DEPLOY_ENV=production 으로 빌드된
        # worker-bundle-production 을 받는다.
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: worker-bundle-production
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Setup Node (if artifact not found)
        if: github.event_name == 'workflow_dispatch' || steps.download.outcome == 'failure'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies (if artifact not found)
        if: github.event_name == 'workflow_dispatch' || steps.download.outcome == 'failure'
        run: npm ci

      - name: Build (if artifact not found)
        if: github.event_name == 'workflow_dispatch' || steps.download.outcome == 'failure'
        run: npm run build
        env:
          # 방안 B: 폴백 빌드도 환경별 DO 인스턴스 키를 주입해야 한다.
          DEPLOY_ENV: production

      - name: Deploy do-worker (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config=wrangler.do.jsonc

      - name: Deploy to Pages (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=${{ env.PROJECT_NAME }} --branch=main

      - name: Deploy probe-scheduler (Production)
        # S104-③-fix (2026-08-11): same scheduler as staging — Workers cron
        # that triggers the Pages deep probe every 15 min.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config=wrangler.cron.jsonc

      - name: Verify deployed commit matches repo (post-deploy gate)
        # S104-③-⑥ (2026-08-11): after the Pages deploy, require the recorded
        # deployment Source commit to EQUAL the checked-out commit exactly
        # (FAIL_ON_COMMIT_DRIFT=1, no ALLOW_BEHIND). Catches a deploy that
        # pushed a stale/wrong bundle while still reporting success. Sleep lets
        # Cloudflare record the new deployment before the list query.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENVIRONMENT: production
          EXPECTED_COMMIT: ${{ github.sha }}
          FAIL_ON_COMMIT_DRIFT: "1"
          COMMIT_CHECK_ONLY: "1"
          npm_config_yes: "true"
        run: |
          sleep 5
          bash scripts/verify-do-binding.sh
