name: Evaluation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'eval/**'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'eval/**'
  schedule:
    # Weekly full run (with cache measurement) → auto-updates README metrics
    - cron: '0 3 * * 1'  # Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: 'Query tag filter (e.g., korean, english, financial, news). Leave empty for all.'
        required: false
        default: ''
      save_baseline:
        description: 'Save results as new baseline (main branch only)'
        required: false
        default: 'false'
        type: boolean
      cache:
        description: 'Measure cache hit rate (doubles runtime). S77: ignored (skipped with a warning) when runs >= 3 — the timeout guard.'
        required: false
        default: 'false'
        type: boolean
      runs:
        description: 'Median runs (3 = median-of-3, ~60min). Emits the S37 wikipedia-429 loss gate warning. Empty = single run. S77: with cache=true, runs >= 3 skips the cache measurement (4-pass budget risks the step timeout).'
        required: false
        default: ''
      loss_threshold:
        description: 'S37: warn (::warning::) when weighted wikipedia-429 NDCG loss exceeds this (default 5.0; 0 disables)'
        required: false
        default: '5.0'
        type: number

env:
  NODE_VERSION: '20'
  SLACK_WEBHOOK: ${{ secrets.ALERT_SLACK_WEBHOOK || '' }}

jobs:
  eval:
    name: Search Quality Evaluation
    runs-on: ubuntu-latest
    # S104-③-⑧ (2026-08-12): the repo's default workflow permission is
    # read-only, so the plain `git push` in "Commit updated baseline" was
    # denied to github-actions[bot] (run 31582039295 step 10 failed with
    # exit 128). contents: write is required for the baseline auto-commit
    # and the weekly README metrics update.
    permissions:
      contents: write
    # S37 (2026-08-08): must cover median runs — runs=3 with 500 queries takes
    # ~60-75min (S31/S32 measured ~75min). The old 30min budget killed a
    # median workflow_dispatch before the step finished. Single runs finish
    # in ~15-20min, so 95min only binds for explicit median invocations.
    # S74 (2026-08-09): budget re-measured on the S68 snapshot — 22-24min per
    # cold run (totalDurationMs 1.33-1.45M). Schedule (2 runs + cache-once,
    # S73 G2) ≈ 2×23 + warm ≈ 51min nominal, ~64min worst case (wide 429
    # window). Bumped to 110min so an extreme weekly 429 window cannot kill
    # the schedule step (setup+install+format eat ~7min of the job budget).
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 3

      # S64 (2026-08-09): eval/ joined the prettier format gate (S62 잔여 ① —
      # format/format:check now includes 'eval/**/*.ts'). ci.yml covers push/PR
      # triggers, but this workflow also runs on a weekly schedule + manual
      # dispatch — the format gate must fire there too so eval/ TS drift cannot
      # slip through an untriggered ci.yml.
      - name: Check formatting (Prettier)
        run: npm run format:check
        timeout-minutes: 2

      - name: Determine run mode
        id: config
        run: |
          TAG_FLAG=""
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG_FLAG="--tag ${{ github.event.inputs.tag }}"
          fi

          SAVE_FLAG=""
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            if [ "${{ github.event.inputs.save_baseline }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
              SAVE_FLAG="--save"
            fi
          fi

          CACHE_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.cache }}" = "true" ]; then
            CACHE_FLAG="--cache"
          fi

          # S37 (2026-08-08): median runs via workflow_dispatch (runs=3) emit
          # the wikipedia-429 loss gate — eval/index.ts computes the S34
          # composition-controlled weighted loss AFTER the median run and
          # prints a GitHub ::warning:: annotation when it exceeds the
          # threshold (availability noise, NOT a failure). S74: schedule's
          # --runs 2 now also emits this warning (runCount > 1) — weekly
          # availability visibility, still non-blocking.
          RUNS_FLAG=""
          if [ -n "${{ github.event.inputs.runs }}" ]; then
            RUNS_FLAG="--runs ${{ github.event.inputs.runs }}"
          elif [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            # G2 (2026-08-09): 2-run stabilization on the regression gate.
            # eval/index.ts uses compareWithBaselineStabilized whenever
            # --runs >= 2 — a query is flagged only when BOTH runs drop
            # >= 0.05 NDCG (single-run noise was ~13% of queries, S67 G2).
            # S74: schedule is included so the WEEKLY full eval (cache mode)
            # gets the same stabilized gate; cache is measured on run 1 only
            # (eval/index.ts), so the budget stays ~51min not ~54min.
            RUNS_FLAG="--runs 2"
          fi
          LOSS_FLAG=""
          if [ -n "${{ github.event.inputs.runs }}" ] && [ -n "${{ github.event.inputs.loss_threshold }}" ]; then
            LOSS_FLAG="--loss-threshold ${{ github.event.inputs.loss_threshold }}"
          fi

          # Weekly/manual-cache runs use the full search-quality eval (direct mode):
          # it supports --cache, computes NDCG/MRR/Precision@10 from gold standards,
          # and writes eval/results/latest.json for the weekly README update.
          # Push/PR runs run the SAME full eval (G10 — the old "self-index
          # benchmark" comment was wrong); with --runs 2 they get the G2
          # 2-run-stabilized regression gate below.
          RUN_MODE="eval:ci:slack"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.cache }}" = "true" ]; then
            RUN_MODE="eval:ci"
          fi

          echo "tag_flag=$TAG_FLAG" >> $GITHUB_OUTPUT
          echo "save_flag=$SAVE_FLAG" >> $GITHUB_OUTPUT
          echo "cache_flag=$CACHE_FLAG" >> $GITHUB_OUTPUT
          echo "runs_flag=$RUNS_FLAG" >> $GITHUB_OUTPUT
          echo "loss_flag=$LOSS_FLAG" >> $GITHUB_OUTPUT
          echo "run_mode=$RUN_MODE" >> $GITHUB_OUTPUT

          echo "=== Eval Configuration ==="
          echo "Run mode: $RUN_MODE"
          echo "Tag filter: ${TAG_FLAG:-all}"
          echo "Save baseline: ${SAVE_FLAG:+yes}${SAVE_FLAG:-no}"
          echo "Cache measurement: ${CACHE_FLAG:+yes}${CACHE_FLAG:-no}"
          echo "Median runs: ${RUNS_FLAG:-none}"
          echo "Loss gate threshold: ${LOSS_FLAG:-disabled}"

      - name: Run evaluation
        id: eval
        continue-on-error: true
        # S37: 50→90min — median-of-3 runs ~60-75min; step must outlive the run.
        # S74: 90→100min — schedule (2 runs + cache-once) measured ~51min
        # nominal / ~64min worst case; margin absorbs an extreme 429 window.
        timeout-minutes: 100
        run: |
          npm run ${{ steps.config.outputs.run_mode }} -- ${{ steps.config.outputs.tag_flag }} ${{ steps.config.outputs.save_flag }} ${{ steps.config.outputs.cache_flag }} ${{ steps.config.outputs.runs_flag }} ${{ steps.config.outputs.loss_flag }} 2>&1

      # S86 (2026-08-10): validate the artifacts the run just wrote BEFORE
      # they are uploaded / committed as a baseline. verify-jsonc.ts --eval
      # syntax-checks eval/results/*.json + eval/baselines/*.json AND checks
      # the EvalReport shape (report.results array) — a truncated write that
      # still parses is caught here, so a corrupt baseline can never be
      # committed by the step below. SKIPs (exit 0) when nothing was written.
      # S86b: the step carries `id: verify` — the baseline-commit and README
      # steps below gate on `steps.verify.outcome == 'success'`. GitHub Actions
      # REPLACES the implicit success() with an explicit `if:`, so a plain
      # ref/event guard would run EVEN when this step fails; the explicit
      # outcome check is what actually blocks committing a corrupt baseline.
      - name: Verify eval artifact JSON integrity
        id: verify
        if: always()
        run: npx tsx scripts/verify-jsonc.ts --eval

      - name: Upload eval results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            eval-results.json
            eval-self-results.json
            eval/results/latest.json
          retention-days: 90
          if-no-files-found: ignore

      # S86b (2026-08-10): only commit the baseline when the integrity check
      # PASSED — a corrupt artifact must never reach main. The verify step
      # fails (exit 1) on a truncated/partial write, so this `if:` skips the
      # commit (and the git push) entirely; the workflow still fails on the
      # red verify step, which is the desired signal.
      #
      # NOTE: this gate is deliberately ONLY about corruption. A run whose
      # eval step FAILED with regressions (continue-on-error) but wrote
      # VALID artifacts still commits the baseline — the regression is
      # surfaced by the Check results / Fail workflow steps below instead,
      # and the baseline tracks the actual measured state (S73 G2 semantics).
      - name: Commit updated baseline
        if: >
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request' &&
          (github.event.inputs.save_baseline == 'true' || github.event_name == 'push') &&
          steps.verify.outcome == 'success'
        run: |
          if [ -f "eval/baselines/latest.json" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add eval/baselines/latest.json
            git diff --cached --quiet || git commit -m "chore: update eval baseline [skip ci]"
            git push
            echo "Baseline updated and committed"
          fi

      # S86b: the weekly README update reads eval/results/latest.json — gate it
      # on the integrity check too, so corrupt metrics are never published.
      - name: Update README metrics (weekly)
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && steps.verify.outcome == 'success'
        run: |
          if [ -f "eval/results/latest.json" ]; then
            npx tsx scripts/update-readme-eval.ts
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git diff --cached --quiet || git commit -m "docs: update README eval metrics [skip ci]"
            git push
            echo "README metrics updated and committed"
          fi

      - name: Check results
        id: check
        run: |
          OUTCOME="${{ steps.eval.outcome }}"
          if [ "$OUTCOME" = "success" ]; then
            echo "status=passed" >> $GITHUB_OUTPUT
            echo "All eval queries passed with no regressions."
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "::warning::Eval detected failures or regressions!"
          fi

      - name: Send Slack alert on regression
        if: steps.check.outputs.status == 'failed' && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.ALERT_SLACK_WEBHOOK }}
        run: |
          echo "Sending Slack alert for eval regression..."
          echo "Slack webhook configured — alert would be sent via eval/runner's built-in notification."
          echo "See eval-results artifact for detailed report."

      - name: Fail workflow on eval failure
        if: steps.check.outputs.status == 'failed'
        run: |
          echo "::error::Search quality evaluation failed — check the report above for details."
          exit 1
