name: Index Seed (Cron)

on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max queries to process (0 = all)'
        required: false
        default: '0'

env:
  API_URL: https://search-engine-api.pages.dev

jobs:
  seed:
    name: Seed Index from Popular Queries
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run cron seed
        env:
          API_URL: ${{ env.API_URL }}
          API_KEY: ${{ secrets.SEARCH_API_KEY }}
          QUERY_FILE: scripts/seed-queries.json
          DELAY: '10'
        run: |
          chmod +x scripts/cron-seed.sh
          # If limit is set, create a temp query file with only N queries
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          if [ "$LIMIT" != "0" ] && [ -n "$LIMIT" ]; then
            head -n "$LIMIT" scripts/seed-queries.json > /tmp/seed-limited.json
            # Wrap in JSON array
            python3 -c "
            import json
            with open('/tmp/seed-limited.json') as f:
                lines = [l.strip().rstrip(',') for l in f if l.strip()]
            # Re-parse as valid JSON
            with open('scripts/seed-queries.json') as f:
                all_queries = json.load(f)
            limited = all_queries[:int('$LIMIT')]
            with open('scripts/seed-queries.json', 'w') as f:
                json.dump(limited, f, ensure_ascii=False)
            "
          fi
          bash scripts/cron-seed.sh

      - name: Report index size
        run: |
          echo "## 📊 Index Size After Seed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          curl -s "${API_URL}/api/health" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          idx = d.get('index', {})
          print(f'| Metric | Value |')
          print(f'|--------|-------|')
          print(f'| Documents | {idx.get(\"total_documents\", \"?\")} |')
          print(f'| Chunks | {idx.get(\"total_chunks\", \"?\")} |')
          print(f'| Health | {idx.get(\"index_health\", \"?\")} |')
          " >> $GITHUB_STEP_SUMMARY
