name: LTR Model Retrain Scheduler

on:
  schedule:
    - cron: '0 3 * * 1'   # Weekly (Monday 03:00 UTC) — retrain from click feedback (Phase C.1)
  workflow_dispatch:
    inputs:
      target_url:
        description: 'API URL to train against (default: production)'
        required: false
        default: 'https://ssak-search.pages.dev'

env:
  TARGET_URL: ${{ github.event.inputs.target_url || 'https://ssak-search.pages.dev' }}

jobs:
  retrain:
    name: Export events and trigger retrain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger /api/ltr/train
        run: |
          if [ -z "$SEARCH_API_KEY" ]; then
            echo "SEARCH_API_KEY not configured — skipping LTR retrain (endpoint requires auth)"
            exit 0
          fi
          RESPONSE=$(curl -sf --max-time 300 -X POST \
            -H "X-API-Key: $SEARCH_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"days": 7, "limit": 20000}' \
            "$TARGET_URL/api/ltr/train" 2>&1) || { echo "Retrain request failed: $RESPONSE"; exit 1; }
          echo "=== Retrain Result ==="
          echo "$RESPONSE" | jq .
          TRAINED=$(echo "$RESPONSE" | jq -r '.trained // false')
          if [ "$TRAINED" != "true" ]; then
            echo "Model not trained (insufficient data?) — see response above"
          fi
        env:
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          TARGET_URL: ${{ env.TARGET_URL }}

      - name: GitHub Summary
        if: always()
        run: |
          echo "## LTR Retrain — $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: ${{ env.TARGET_URL }}" >> $GITHUB_STEP_SUMMARY
