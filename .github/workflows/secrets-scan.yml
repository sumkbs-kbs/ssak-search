name: secrets-scan

# 평문 시크릿(API 키/토큰)이 리포에 들어오는 것을 push/PR 단계에서 차단한다.
# 2026-08-27 README 프로덕션 키 노출 사고 → 본 게이트 도입 (docs/SECRET_ROTATION.md 참조).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 히스토리 스캔 — 최근 커밋만 보면 과거 노출을 놓친다

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

      - name: Known-leaked literal must NOT exist (regression guard)
        run: |
          set -euo pipefail
          if grep -rn "sk-d3TK" . --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.omo 2>/dev/null; then
            echo "leaked key literal resurrected in repo" >&2
            exit 1
          fi
          echo "no leaked-key literal found"
