  # OpenAI-compatible API
  # ====================================================================
  /v1/models:
    get:
      summary: List available models (OpenAI-compatible)
      description: |
        Returns a list of available models in OpenAI-compatible format.
        Models: search-engine, search-engine-deep, research-engine.
      operationId: openaiModels
      tags:
        - OpenAI
      responses:
        "200":
          description: Model list in OpenAI format
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        object:
                          type: string
                        created:
                          type: integer
                        owned_by:
                          type: string
      security:
        - ApiKeyAuth: []

  /v1/chat/completions:
    post:
      summary: Chat completions (OpenAI-compatible)
      description: |
        OpenAI-compatible chat completions endpoint that wraps the
        search engine's capabilities. Supports three models:
        - `search-engine`: Basic web search with answer
        - `search-engine-deep`: Advanced search with deeper analysis
        - `research-engine`: Multi-step deep research
      operationId: openaiChat
      tags:
        - OpenAI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                model:
                  type: string
                  enum: [search-engine, search-engine-deep, research-engine]
                  default: search-engine
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum: [user, assistant, system]
                      content:
                        type: string
                max_tokens:
                  type: integer
                  default: 2000
                stream:
                  type: boolean
                  default: false
                temperature:
                  type: number
                  default: 0.7
      responses:
        "200":
          description: OpenAI-compatible chat response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  object:
                    type: string
                  created:
                    type: integer
                  model:
                    type: string
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        message:
                          type: object
                          properties:
                            role:
                              type: string
                            content:
                              type: string
                          required: [role, content]
                        finish_reason:
                          type: string
                  usage:
                    type: object
                    properties:
                      prompt_tokens:
                        type: integer
                      completion_tokens:
                        type: integer
                      total_tokens:
                        type: integer
      security:
        - ApiKeyAuth: []

