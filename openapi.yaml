# ====================================================================
# Components
# ====================================================================
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: |
        Optional API key authentication. Set `SEARCH_API_KEY` secret to enable.
        Send as `Authorization: Bearer <key>` or `X-API-Key: <key>` header.

  schemas:
    # --- Search ---
    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          maxLength: 2000
          example: "what is quantum computing"
        search_depth:
          type: string
          enum: [basic, advanced]
          default: basic
        topic:
          type: string
          enum: [general, news, finance]
          default: general
        max_results:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
        include_answer:
          type: boolean
          default: false
        include_raw_content:
          type: boolean
          default: false
        include_domains:
          type: array
          items:
            type: string
          maxItems: 20
        exclude_domains:
          type: array
          items:
            type: string
          maxItems: 20
        time_range:
          type: string
          enum: [day, week, month, year]
        sort_by:
          type: string
          enum: [relevance, date]
          default: relevance
        focus:
          type: string
          enum: [all, academic, news, writing, video, social, finance, math]
          default: all
        page:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
        include_fact_check:
          type: boolean
          default: false
        country:
          type: string
          description: Country code for location-aware results
        language:
          type: string
          description: Language code for results
        location:
          type: string
          description: Location string (max 50 chars)
        user_id:
          type: string
          maxLength: 200
          description: Optional client identifier for A/B experiment assignment
        max_tokens:
          type: integer
          default: 4000
          maximum: 8000

    SearchResponse:
      type: object
      properties:
        query:
          type: string
        answer:
          $ref: "#/components/schemas/SearchAnswer"
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        response_time_ms:
          type: integer
        backend:
          type: string
        fallback_used:
          type: boolean
        related_queries:
          type: array
          items:
            type: string
        cached:
          type: boolean
        page:
          type: integer
        page_size:
          type: integer
        total_results:
          type: integer
        total_pages:
          type: integer
        images:
          type: array
          items:
            $ref: "#/components/schemas/ImageResult"
        knowledge_graph:
          $ref: "#/components/schemas/KnowledgeGraph"
        subrequest_estimate:
          type: integer

    SearchAnswer:
      type: object
      properties:
        text:
          type: string
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        sources:
          type: array
          items:
            type: integer

    SearchResult:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
          format: uri
        content:
          type: string
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
        raw_content:
          type: string
        published_date:
          type: string
          format: date-time
          nullable: true
        author:
          type: string
          nullable: true
        domain:
          type: string
        images:
          type: array
          items:
            type: string
        stock_data:
          $ref: "#/components/schemas/StockData"
        rich_snippet:
          $ref: "#/components/schemas/RichSnippet"

    StockData:
      type: object
      properties:
        name:
          type: string
        ticker:
          type: string
        exchange:
          type: string
        price:
          type: number
        currency:
          type: string
        change:
          type: number
        change_percent:
          type: number
        direction:
          type: string
          enum: [up, down, flat]

    RichSnippet:
      type: object
      properties:
        type:
          type: string
          enum: [rating, price, faq, article, breadcrumb]
        rating:
          type: number
        review_count:
          type: integer
        price:
          type: string
        author:
          type: string
        reading_time_min:
          type: integer

    ImageResult:
      type: object
      properties:
        url:
          type: string
          format: uri
        title:
          type: string
        source:
          type: string
        width:
          type: integer
        height:
          type: integer
        thumbnail:
          type: string
        content:
          type: string
        score:
          type: number
        domain:
          type: string

    KnowledgeGraph:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        url:
          type: string
          format: uri
        image:
          type: string
          format: uri
        type:
          type: string
          enum: [person, organization, place, concept]
        facts:
          type: object
          additionalProperties:
            type: string

    # --- Extract ---
    ExtractRequest:
      type: object
      required: [urls]
      properties:
        urls:
          oneOf:
            - type: string
              format: uri
            - type: array
              items:
                type: string
                format: uri
              maxItems: 20
          description: URL(s) to extract (max 20)
        include_images:
          type: boolean
          default: false
        max_tokens:
          type: integer
          default: 8000
          maximum: 16000

    ExtractResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ExtractedContent"
        failed_results:
          type: array
          items:
            $ref: "#/components/schemas/ExtractedContent"
        response_time_ms:
          type: integer

    ExtractedContent:
      type: object
      properties:
        url:
          type: string
          format: uri
        title:
          type: string
        raw_content:
          type: string
        images:
          type: array
          items:
            type: string
        rich_snippet:
          $ref: "#/components/schemas/RichSnippet"
        success:
          type: boolean
        error:
          type: string

    # --- Health ---
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, partial_outage]
        version:
          type: string
        timestamp:
          type: string
          format: date-time
        backends:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [operational, degraded, down, unconfigured, disabled, unknown]
              description: |
                `unconfigured` = optional backend whose required credential is
                absent (e.g. brave without BRAVE_API_KEY); excluded from the
                global status rollup.
              latency_ms:
                type: integer
        features:
          type: object
          additionalProperties:
            type: boolean
        notes:
          type: array
          items:
            type: string
        auth_required:
          type: boolean

    BackendHealth:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, down]
        failures:
          type: integer
        inflight:
          type: integer
        tripped:
          type: boolean

    # --- News ---
    NewsResponse:
      type: object
      properties:
        query:
          type: string
        articles:
          type: array
          items:
            $ref: "#/components/schemas/NewsArticle"
        response_time_ms:
          type: integer
        source:
          type: string

    NewsArticle:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
        content:
          type: string
        score:
          type: number
        domain:
          type: string
        published_date:
          type: string
          format: date-time
        author:
          type: string

    # --- Research ---
    ResearchResponse:
      type: object
      properties:
        query:
          type: string
        answer:
          type: string
        sources:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              url:
                type: string
        sub_queries:
          type: array
          items:
            type: string
        depth:
          type: string
        response_time_ms:
          type: integer
        quality_estimate:
          type: string

    # --- Chat ---
    ChatRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        thread_id:
          type: string
          description: Existing thread ID to continue conversation
        depth:
          type: string
          enum: [quick, deep]
          default: quick
        max_sources:
          type: integer
          default: 15
        focus:
          type: string
          enum: [all, academic, news, writing, video, social, finance, math]

    ChatResponse:
      type: object
      properties:
        thread_id:
          type: string
        answer:
          type: string
        sources:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              url:
                type: string
        message_count:
          type: integer
        response_time_ms:
          type: integer

    # --- Pages ---
    PageData:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        query:
          type: string
        answer:
          type: string
        sources:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              url:
                type: string
        sub_queries:
          type: array
          items:
            type: string
        depth:
          type: string
        created_at:
          type: number
        updated_at:
          type: number

    CreatePageRequest:
      type: object
      required: [title, query, answer, sources]
      properties:
        title:
          type: string
        query:
          type: string
        answer:
          type: string
        sources:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              url:
                type: string
        sub_queries:
          type: array
          items:
            type: string
        depth:
          type: string
        quality_estimate:
          type: string
        response_time_ms:
          type: integer

    UpdatePageRequest:
      type: object
      properties:
        title:
          type: string
        answer:
          type: string
        sources:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              url:
                type: string
        sub_queries:
          type: array
          items:
            type: string
        quality_estimate:
          type: string

    # --- Upload ---
    UploadResponse:
      type: object
      properties:
        file_id:
          type: string
        filename:
          type: string
        content_type:
          type: string
        file_size:
          type: integer
        summary:
          type: string
        key_points:
          type: array
          items:
            type: string
        uploaded_at:
          type: number

    UploadedFile:
      type: object
      properties:
        file_id:
          type: string
        filename:
          type: string
        content_type:
          type: string
        file_size:
          type: integer
        uploaded_at:
          type: number

    # --- Library ---
    LibraryCollection:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        item_count:
          type: integer
        created_at:
          type: number
        updated_at:
          type: number

    CreateCollectionRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    CreateItemRequest:
      type: object
      required: [collection_id, query]
      properties:
        collection_id:
          type: string
        query:
          type: string
        answer:
          type: string
        sources:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              url:
                type: string
        tags:
          type: array
          items:
            type: string

    # --- Profile ---
    UserProfile:
      type: object
      properties:
        user_id:
          type: string
        preferences:
          $ref: "#/components/schemas/UserPreferences"
        recently_visited_domains:
          type: array
          items:
            type: object
            properties:
              domain:
                type: string
              count:
                type: integer
              last_visited:
                type: number
        created_at:
          type: number
        updated_at:
          type: number

    UserPreferences:
      type: object
      properties:
        language:
          type: string
        focus_mode:
          type: string
          enum: [all, academic, news, writing, video, social, finance, math]
        theme:
          type: string
          enum: [light, dark, system]
        max_sources:
          type: integer
        exclude_domains:
          type: array
          items:
            type: string

    # --- Video ---
    VideoResult:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
        video_id:
          type: string
        channel:
          type: string
        duration:
          type: string
        views:
          type: integer
        published_date:
          type: string
        thumbnail:
          type: string
        transcript:
          type: string

    # --- Spaces ---
    SpaceData:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        name:
          type: string
        description:
          type: string
        instructions:
          type: string
        focus_mode:
          type: string
        files:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              file_key:
                type: string
              mime_type:
                type: string
              size:
                type: integer
              uploaded_at:
                type: number
        created_at:
          type: number
        updated_at:
          type: number

    CreateSpaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        instructions:
          type: string
        focus_mode:
          type: string

    UpdateSpaceRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        instructions:
          type: string
        focus_mode:
          type: string

    # --- Error ---
    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string
        query:
          type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: API key required or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limit exceeded (30 req/min per IP)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      headers:
        Retry-After:
          schema:
            type: integer
            example: 60
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ExtractSuccess:
      description: Successful extraction
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExtractResponse"

