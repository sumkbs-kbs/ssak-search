openapi: "3.1.0"
info:
  title: ssak-search
  description: |
    Tavily-compatible AI search engine — no API keys required for backends.

    Scrapes Bing mobile, Naver mobile, Wikipedia, GitHub, HackerNews, Reddit,
    arXiv, DuckDuckGo, and YouTube. Provides structured search results with
    optional AI-generated answer, content extraction, deep research,
    conversational chat, product search, and more.

    **Features:**
    - 🇰🇷 Korean-optimized (Naver primary backend, stock card parsing)
    - 🌐 CJK support (bigram matching, mkt=zh-CN, Chinese query cleaning)
    - 🔒 SSRF-protected extract endpoint
    - 🤖 AI-powered search, research, and chat
    - 📊 Adaptive quality thresholds (3-tier minScore)
    - ⚡ Response caching with page-aware keys
    - 🛡️ Circuit-breaker per backend + per-IP rate limiting
    - 🔌 OpenAI-compatible /v1/chat/completions endpoint
  version: "2.0.0"
  contact:
    name: Byungseok Kang
    email: sumkbs@gmail.com
  license:
    name: MIT
    url: https://github.com/mr.k/webapp/blob/main/LICENSE

servers:
  - url: https://webapp.pages.dev
    description: Production
  - url: http://localhost:8788
    description: Local development

paths:
  # ====================================================================
  # API Root
  # ====================================================================
  /api:
    get:
      summary: API root — list available endpoints
      operationId: apiRoot
      tags:
        - General
      responses:
        "200":
          description: Endpoint listing with version info
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: string
                  description:
                    type: string
                  endpoints:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        method:
                          type: array
                          items:
                            type: string
                        path:
                          type: string
                        description:
                          type: string

  # ====================================================================
  # Agent Optimized API (Sub-Second Latency & High-Density)
  # ====================================================================
  /api/agent/search:
    post:
      summary: High-speed agent search (Sub-second early return)
      description: |
        Optimized search endpoint designed specifically for AI Agents (LLM Function Calling).
        Uses parallel race orchestration with early abort to cut P95 latency below 1000ms.
      operationId: agentSearch
      tags:
        - Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: Keyword-dense search query
                  example: "삼성전자 오늘 주가"
                max_results:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 5
      responses:
        "200":
          description: Fast search hits with signal confidence
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  took_ms:
                    type: integer
                  signal_confidence:
                    type: string
                    enum: [HIGH, MEDIUM, LOW]
                  hits:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        url:
                          type: string
                        snippet:
                          type: string
                        score:
                          type: number
                        source:
                          type: string

  /api/agent/stream-search:
    post:
      summary: Real-time SSE streaming agent search
      description: Streams individual search hits as they arrive via Server-Sent Events (TTFT < 300ms).
      operationId: agentStreamSearch
      tags:
        - Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                max_results:
                  type: integer
                  default: 5
      responses:
        "200":
          description: SSE event stream of search hits
          content:
            text/event-stream:
              schema:
                type: string

  /api/agent/extract:
    post:
      summary: High-density stealth markdown & JSON-LD extraction
      description: |
        Extracts clean, noise-free Markdown or Schema.org JSON-LD structured facts.
        Features 4-tier anti-bot stealth escalation, TOC extraction, and section targeting.
      operationId: agentExtract
      tags:
        - Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                  example: "https://en.wikipedia.org/wiki/Artificial_intelligence"
                extract_depth:
                  type: string
                  enum: [summary, full_markdown, structured_facts, toc_only]
                  default: full_markdown
                section_target:
                  type: string
                  description: Optional heading name to filter specific section
                  example: "Ethics"
                max_token_budget:
                  type: integer
                  minimum: 500
                  maximum: 16000
                  default: 4000
      responses:
        "200":
          description: Clean extracted content or actionable error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  url:
                    type: string
                  markdown_content:
                    type: string
                  structured_data:
                    type: object
                  table_of_contents:
                    type: array
                    items:
                      type: string
                  token_count:
                    type: integer
                  escalation_tier:
                    type: string
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      detail:
                        type: string
                      agent_hint:
                        type: string
                      suggested_action:
                        type: string

  # ====================================================================
  # Search
  # ====================================================================
  /api/search:
    get:
      summary: Search the web (simplified GET interface)
      description: |
        Simplified GET interface for quick testing and curl-ability.
        Supports the same parameters as POST, passed as query strings.
      operationId: searchGet
      tags:
        - Search
      parameters:
        - name: query
          in: query
          description: The search query
          required: true
          schema:
            type: string
            maxLength: 2000
            example: "삼성전자 주가"
        - name: q
          in: query
          description: Alias for query
          schema:
            type: string
        - name: max_results
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
        - name: limit
          in: query
          description: Alias for max_results
          schema:
            type: integer
        - name: search_depth
          in: query
          schema:
            type: string
            enum: [basic, advanced]
            default: basic
        - name: topic
          in: query
          schema:
            type: string
            enum: [general, news, finance]
            default: general
        - name: include_answer
          in: query
          schema:
            type: boolean
            default: false
        - name: answer
          in: query
          description: Alias for include_answer
          schema:
            type: boolean
        - name: include_raw_content
          in: query
          schema:
            type: boolean
            default: false
        - name: time_range
          in: query
          schema:
            type: string
            enum: [day, week, month, year]
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [relevance, date]
            default: relevance
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 1
        - name: focus
          in: query
          schema:
            type: string
            enum: [all, academic, news, writing, video, social, finance, math]
            default: all
          description: Focus mode to specialize search for a specific domain
        - name: include_domains
          in: query
          description: Comma-separated list of allowed domains (max 20)
          schema:
            type: string
        - name: exclude_domains
          in: query
          description: Comma-separated list of excluded domains (max 20)
          schema:
            type: string
        - name: include_fact_check
          in: query
          schema:
            type: boolean
            default: false
        - name: country
          in: query
          description: Country code for location-aware results
          schema:
            type: string
        - name: language
          in: query
          description: Language code for results
          schema:
            type: string
        - name: location
          in: query
          description: Location string (max 50 chars) for location-aware results
          schema:
            type: string
      responses:
        "200":
          description: Successful search response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - ApiKeyAuth: []

    post:
      summary: Search the web (primary endpoint)
      description: |
        Full-featured search endpoint compatible with Tavily's API.
        Returns structured search results with optional AI-generated answer,
        images, knowledge graph, and pagination metadata.
      operationId: searchPost
      tags:
        - Search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Successful search response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Request body too large (max 64KB)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - ApiKeyAuth: []

  /api/search/stream:
    get:
      summary: Stream search results and AI answer (SSE)
      description: |
        Server-Sent Events endpoint that sends search results immediately,
        then streams the AI answer word-by-word for a typewriter effect.
      operationId: searchStream
      tags:
        - Search
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: q
          in: query
          description: Alias for query
          schema:
            type: string
        - name: max_results
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
        - name: limit
          in: query
          description: Alias for max_results
          schema:
            type: integer
        - name: search_depth
          in: query
          schema:
            type: string
            enum: [basic, advanced]
            default: basic
        - name: topic
          in: query
          schema:
            type: string
            enum: [general, news, finance]
            default: general
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
      security:
        - ApiKeyAuth: []

  # ====================================================================
  # Extract
  # ====================================================================
  /api/extract:
    get:
      summary: Extract content from URLs (GET)
      operationId: extractGet
      tags:
        - Extract
      parameters:
        - name: urls
          in: query
          description: Comma-separated list of URLs to extract (max 20)
          required: true
          schema:
            type: string
        - name: include_images
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Successful extraction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - ApiKeyAuth: []

    post:
      summary: Extract content from URLs (primary)
      description: |
        Extract clean markdown content from one or more URLs.
        Uses Jina Reader API if JINA_API_KEY is configured, otherwise
        falls back to HTMLRewriter-based extraction.
        SSRF-protected: private/loopback/link-local IPs blocked.
      operationId: extractPost
      tags:
        - Extract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractRequest"
      responses:
        "200":
          $ref: "#/components/responses/ExtractSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: Request body too large (max 64KB)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      security:
        - ApiKeyAuth: []

  # ====================================================================
  # Images
  # ====================================================================
  /api/images:
    get:
      summary: Search images (GET)
      operationId: imageSearchGet
      tags:
        - Images
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: q
          in: query
          description: Alias for query
          schema:
            type: string
        - name: max_results
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
        - name: size
          in: query
          schema:
            type: string
            enum: [small, medium, large, wallpaper]
        - name: color
          in: query
          schema:
            type: string
            enum: [color, monochrome, red, orange, yellow, green, blue, purple, pink, brown, black, white, gray]
        - name: type
          in: query
          schema:
            type: string
            enum: [photo, clipart, gif, transparent, line]
      responses:
        "200":
          description: Image search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  images:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImageResult"
                  response_time_ms:
                    type: integer
      security:
        - ApiKeyAuth: []

    post:
      summary: Search images (POST)
      operationId: imageSearchPost
      tags:
        - Images
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                max_results:
                  type: integer
                  default: 10
                size:
                  type: string
                color:
                  type: string
                type:
                  type: string
      responses:
        "200":
          description: Image search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  images:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImageResult"
                  response_time_ms:
                    type: integer
      security:
        - ApiKeyAuth: []

  # ====================================================================
  # News
  # ====================================================================
  /api/news:
    get:
      summary: Search news (GET)
      operationId: newsSearchGet
      tags:
        - News
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: max_results
          in: query
          schema:
            type: integer
            default: 10
        - name: source
          in: query
          schema:
            type: string
            enum: [all, bing, hackernews, reddit]
            default: all
      responses:
        "200":
          description: News search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsResponse"
      security:
        - ApiKeyAuth: []

    post:
      summary: Search news (POST)
      operationId: newsSearchPost
      tags:
        - News
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                max_results:
                  type: integer
                  default: 10
                source:
                  type: string
                  enum: [all, bing, hackernews, reddit]
                  default: all
      responses:
        "200":
          description: News search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsResponse"
      security:
        - ApiKeyAuth: []

  /api/news/trending:
    get:
      summary: Get trending news
      operationId: newsTrending
      tags:
        - News
      responses:
        "200":
          description: Trending news
          content:
            application/json:
              schema:
                type: object
                properties:
                  articles:
                    type: array
                    items:
                      $ref: "#/components/schemas/NewsArticle"

  # ====================================================================
  # Research (Multi-step Deep Research)
  # ====================================================================
  /api/research:
    get:
      summary: Deep research (GET)
      description: |
        Multi-step deep research that decomposes complex queries into
        sub-queries, executes them, and synthesizes a comprehensive answer.
      operationId: researchGet
      tags:
        - Research
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: depth
          in: query
          schema:
            type: string
            enum: [quick, deep]
            default: quick
          description: "quick=3 sub-queries, deep=6 sub-queries"
        - name: max_sources
          in: query
          schema:
            type: integer
            default: 15
      responses:
        "200":
          description: Research report with synthesized answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchResponse"
      security:
        - ApiKeyAuth: []

    post:
      summary: Deep research (POST)
      operationId: researchPost
      tags:
        - Research
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                depth:
                  type: string
                  enum: [quick, deep]
                  default: quick
                max_sources:
                  type: integer
                  default: 15
      responses:
        "200":
          description: Research report with synthesized answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchResponse"
      security:
        - ApiKeyAuth: []

  # ====================================================================
  # Chat (Conversational Threads)
  # ====================================================================
  /api/chat:
    post:
      summary: Multi-turn conversational chat with context-aware research
      description: |
        Start or continue a conversation thread. If thread_id is provided,
        the conversation context is maintained. Each turn performs research
        based on the conversation history.
      operationId: chatPost
      tags:
        - Chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Chat response with answer and sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "501":
          description: THREAD_DO binding not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - ApiKeyAuth: []

  # ====================================================================
  # Suggest (Autocomplete)
  # ====================================================================
  /api/suggest:
    get:
      summary: Search query autocomplete suggestions
      description: |
        Returns query autocomplete suggestions from DuckDuckGo with
        Bing Suggest as fallback.
      operationId: suggestGet
      tags:
        - Search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Autocomplete suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  suggestions:
                    type: array
                    items:
                      type: string
                  response_time_ms:
                    type: integer

  # ====================================================================
  # Canary (Parser Regression Detection)
  # ====================================================================
  /api/canary:
    get:
      summary: Parser regression detection
      description: |
        Runs real search queries against each backend and validates
        that result extraction is working correctly.
        Requires HEALTH_CANARY_ENABLED=true environment variable.
        Rate-limited to 1 request per 5 minutes.
      operationId: canaryGet
      tags:
        - Monitoring
      responses:
        "200":
          description: Canary check results
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        backend:
                          type: string
                        ok:
                          type: boolean
                        result_count:
                          type: integer
                        error:
                          type: string
                  response_time_ms:
                    type: integer

  # ====================================================================
  # Health & Metrics
  # ====================================================================
  /api/health:
    get:
      summary: Service health status
      description: |
        Liveness by default (zero subrequests, < 50ms): status/backends come from
        the circuit-breaker state, index from binding presence.
        Opt-in deep probe mode (`depth=full`) runs live backend probes + D1
        corpus stats + Slack alerts, cached for 30 seconds.
      operationId: healthCheck
      tags:
        - Monitoring
      parameters:
        - name: depth
          in: query
          description: light (default, zero subrequests) or full (live probes, cached 30s)
          schema:
            type: string
            enum: [light, full]
            default: light
        - name: full
          in: query
          description: Backward-compatible alias for depth=full
          schema:
            type: boolean
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/metrics:
    get:
      summary: Prometheus-format metrics
      description: |
        Returns Prometheus-format metrics for scraping.
      operationId: metricsGet
      tags:
        - Monitoring
      responses:
        "200":
          description: Prometheus metrics text
          content:
            "text/plain; version=0.0.4":
              schema:
                type: string

  /api/monitor:
    get:
      summary: SLO monitor report
      description: |
        Returns SLO compliance report including error budget,
        alert evaluations, and cache metrics.
      operationId: monitorGet
      tags:
        - Monitoring
      responses:
        "200":
          description: SLO monitor report
          content:
            application/json:
              schema:
                type: object
                properties:
                  health:
                    type: string
                  uptime_ratio:
                    type: number
                  slos:
                    type: object
                    properties:
                      availability:
                        type: object
                        properties:
                          target:
                            type: number
                          current:
                            type: number
                          error_budget_remaining:
                            type: number
                      cache_hit_rate:
                        type: object
                        properties:
                          target:
                            type: number
                          current:
                            type: number
                  alerts:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        severity:
                          type: string
                        message:
                          type: string
                  backends:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/BackendHealth"

  /api/usage:
    get:
      summary: API usage statistics
      description: |
        Returns request volume, error rates, and subrequest count statistics.
      operationId: usageGet
      tags:
        - Monitoring
      responses:
        "200":
          description: Usage statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_requests:
                    type: integer
                  total_errors:
                    type: integer
                  avg_search_subrequests:
                    type: number
                  tracked_since:
                    type: string
                    format: date-time

  # ====================================================================
  # Saved Pages
  # ====================================================================
  /api/pages:
    get:
      summary: List saved pages
      operationId: pagesList
      tags:
        - Pages
      responses:
        "200":
          description: List of saved pages
          content:
            application/json:
              schema:
                type: object
                properties:
                  pages:
                    type: array
                    items:
                      $ref: "#/components/schemas/PageData"
        "501":
          description: PAGES_DO binding not configured
      security:
        - ApiKeyAuth: []

    post:
      summary: Create a saved page
      operationId: pagesCreate
      tags:
        - Pages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePageRequest"
      responses:
        "200":
          description: Created page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageData"
        "501":
          description: PAGES_DO binding not configured
      security:
        - ApiKeyAuth: []

  /api/pages/{id}:
    get:
      summary: Get a saved page by ID
      operationId: pagesGet
      tags:
        - Pages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Page data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageData"
        "404":
          description: Page not found
        "501":
          description: PAGES_DO binding not configured
      security:
        - ApiKeyAuth: []

    put:
      summary: Update a saved page
      operationId: pagesUpdate
