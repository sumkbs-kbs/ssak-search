[project]
name = "answer-sdk"
version = "0.1.0"
description = "Python SDK for the Answer Engine API — search, extract, and stream AI answers"
license = { text = "MIT" }
authors = [
  { name = "Byungseok Kang", email = "sumkbs@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "sse-starlette>=2.0,<3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/mr.k/webapp"
Repository = "https://github.com/mr.k/webapp/tree/main/packages/answer-sdk-py"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["answer_sdk"]
