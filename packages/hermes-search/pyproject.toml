[project]
name = "hermes-search"
version = "0.1.0"
description = "Hermes Agent Search Engine — Tavily-compatible Python SDK for self-contained search API"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Byungseok Kang", email = "sumkbs@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "sse-starlette>=2.0,<3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/mr.k/webapp"
Repository = "https://github.com/mr.k/webapp/tree/main/packages/hermes-search"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hermes_search"]
