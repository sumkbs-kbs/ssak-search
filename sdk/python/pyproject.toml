[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ssak-search-sdk"
version = "0.1.0"
description = "Python client for the ssak-search web search API (stdlib only, no deps)"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools]
packages = ["ssaksearch"]
